# Guide: https://shrra.github.io/python-intermediate-development/23-continuous-integration-automated-testing/index.html

name: Unit test and code coverage

# We can specify which Github events will trigger a CI build
on: push

# now define a single job 'build' (but could define more)
jobs:

  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    # a job is a seq of steps
    steps:

    # Next we need to checkout out repository, and set up Python
    # A 'name' is just an optional label shown in the log - helpful to clarify progress - and can be anything
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -e .
        python3 -m pip install pytest pytest-cov hypothesis

    - name: Test with PyTest and generate coverage report
      run: |
        python3 -m pytest tests/ --cov=distclassipy --cov-report=xml

    - name: Upload coverage report to codecov
      uses: codecov/codecov-action@v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: sidchaini/DistClassiPy

  # Build the sdist, install it into a clean environment and run the test
  # suite against the *installed* package. This catches packaging bugs
  # (MANIFEST, build requirements) that the editable install above hides.
  sdist:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Build sdist
      run: |
        python3 -m pip install --upgrade pip build
        python3 -m build --sdist

    # Run from outside the checkout: tests/__init__.py makes pytest put the
    # repo root on sys.path, and the uncompiled source tree there would
    # shadow the installed package (no compiled _cdistances extension).
    - name: Install from sdist and test outside the checkout
      run: |
        python3 -m pip install dist/*.tar.gz pytest hypothesis
        cp -r tests "$RUNNER_TEMP/"
        cd "$RUNNER_TEMP"
        python3 -c "import distclassipy; print(distclassipy.__file__)"
        python3 -m pytest tests -q